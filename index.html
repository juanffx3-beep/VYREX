<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VYREX - Música para todos</title>
  <meta name="description" content="VYREX: escucha millones de canciones. Modo Free y VIP.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-paused">
  <div id="splash" class="splash" aria-hidden="true">
    <img class="logo-img splash-logo" src="assets/logo.svg" alt="">
  </div>

  <!-- ===== Inicio de sesión / Registro ===== -->
  <main id="auth-screen" class="auth-screen" hidden>
    <div class="auth-card">
      <img class="logo-img auth-logo" src="assets/logo.svg" alt="VYREX">
      <h1 id="auth-title" class="auth-title">Inicia sesión en VYREX</h1>

      <button id="google-btn" class="google-btn" type="button">
        <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.5z"/></svg>
        <span>Continuar con Google</span>
      </button>

      <div class="divider"><span>o</span></div>

      <form id="auth-form" class="auth-form" novalidate>
        <div class="field" id="field-name" hidden>
          <label for="auth-name">Nombre</label>
          <input id="auth-name" name="name" autocomplete="name" maxlength="40" placeholder="¿Cómo te llamamos?">
        </div>
        <div class="field">
          <label for="auth-email">Correo electrónico</label>
          <input id="auth-email" name="email" type="email" autocomplete="email" placeholder="nombre@dominio.com" required>
        </div>
        <div class="field">
          <label for="auth-pass">Contraseña</label>
          <div class="pass-wrap">
            <input id="auth-pass" name="password" type="password" autocomplete="current-password" placeholder="Contraseña" required>
            <button type="button" id="toggle-pass" class="pass-toggle" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
          </div>
        </div>
        <div class="field" id="field-confirm" hidden>
          <label for="auth-confirm">Confirmar contraseña</label>
          <input id="auth-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repite la contraseña">
        </div>
        <p id="auth-error" class="auth-error" role="alert"></p>
        <button id="auth-submit" class="btn-primary" type="submit">Iniciar sesión</button>
      </form>

      <p class="auth-switch">
        <span id="switch-text">¿No tienes cuenta?</span>
        <button type="button" id="switch-mode" class="link-btn">Regístrate en VYREX</button>
      </p>
      <p id="auth-note" class="auth-note"></p>
    </div>
  </main>

  <!-- ===== Aplicación ===== -->
  <div id="app" class="app" hidden>
    <aside class="sidebar" aria-label="Navegación principal">
      <nav class="side-box side-nav">
        <a class="brand" href="#/home" aria-label="VYREX inicio">
          <img class="logo-img brand-logo" src="assets/logo.svg" alt="">
          <span class="brand-name">VYREX</span>
        </a>
        <a class="nav-link" data-route="home" href="#/home"><span data-icon="home"></span>Inicio</a>
        <a class="nav-link" data-route="search" href="#/search"><span data-icon="search"></span>Buscar</a>
      </nav>
      <section class="side-box library" aria-label="Tu biblioteca">
        <header class="lib-head">
          <a class="nav-link" data-route="library" href="#/library"><span data-icon="library"></span>Tu biblioteca</a>
        </header>
        <div class="lib-chips" role="group" aria-label="Filtrar biblioteca">
          <button class="chip" data-action="lib-filter" data-filter="playlists">Playlists</button>
          <button class="chip" data-action="lib-filter" data-filter="artists">Artistas</button>
        </div>
        <div id="lib-list" class="lib-list"></div>
        <div id="side-promo"></div>
      </section>
    </aside>

    <main id="main" class="main">
      <div class="page-bg" aria-hidden="true"></div>
      <header id="topbar" class="topbar">
        <div class="tb-left">
          <button class="round-btn" data-action="back" aria-label="Atrás"><span data-icon="chev-left" data-icon-size="20"></span></button>
          <button class="round-btn" data-action="forward" aria-label="Adelante"><span data-icon="chev-right" data-icon-size="20"></span></button>
          <label id="search-box" class="search-box" hidden>
            <span data-icon="search" data-icon-size="20"></span>
            <input id="search-input" type="search" placeholder="¿Qué quieres reproducir?" autocomplete="off" aria-label="Buscar canciones, artistas o playlists">
          </label>
        </div>
        <div id="tb-right" class="tb-right"></div>
      </header>
      <div id="view" class="view"></div>
    </main>

    <footer id="player" class="player" aria-label="Reproductor">
      <div class="np">
        <img id="np-cover" class="np-cover" src="assets/logo.svg" alt="">
        <div class="np-text">
          <span id="np-title" class="np-title">VYREX</span>
          <span id="np-artist" class="np-artist">Elige una canción</span>
        </div>
        <button id="np-like" class="icon-btn" data-action="like-current" aria-label="Guardar en Canciones que te gustan"><span data-icon="heart" data-icon-size="16"></span></button>
      </div>
      <div class="controls">
        <div class="ctrl-buttons">
          <button id="btn-shuffle" class="icon-btn" data-action="toggle-shuffle" aria-label="Aleatorio"><span data-icon="shuffle" data-icon-size="16"></span></button>
          <button id="btn-prev" class="icon-btn" data-action="prev" aria-label="Anterior"><span data-icon="prev" data-icon-size="18"></span></button>
          <button id="btn-play" class="play-main" data-action="toggle-play" aria-label="Reproducir"><span data-icon="play" data-icon-size="18"></span></button>
          <button id="btn-next" class="icon-btn" data-action="next" aria-label="Siguiente"><span data-icon="next" data-icon-size="18"></span></button>
          <button id="btn-repeat" class="icon-btn" data-action="toggle-repeat" aria-label="Repetir"><span data-icon="repeat" data-icon-size="16"></span></button>
        </div>
        <div class="progress-row">
          <span id="time-cur" class="time">0:00</span>
          <input id="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Progreso de la canción">
          <span id="time-dur" class="time">0:00</span>
        </div>
      </div>
      <div class="extras">
        <span id="quality-badge" class="quality">Normal</span>
        <button id="btn-mute" class="icon-btn" data-action="toggle-mute" aria-label="Silenciar"><span data-icon="volume" data-icon-size="16"></span></button>
        <input id="volume" type="range" min="0" max="100" value="70" aria-label="Volumen">
      </div>
      <div class="mini-progress" aria-hidden="true"><i id="mini-bar"></i></div>
    </footer>

    <nav class="bottom-nav" aria-label="Navegación móvil">
      <a data-route="home" href="#/home"><span data-icon="home"></span>Inicio</a>
      <a data-route="search" href="#/search"><span data-icon="search"></span>Buscar</a>
      <a data-route="library" href="#/library"><span data-icon="library"></span>Biblioteca</a>
      <a data-route="premium" href="#/premium"><span data-icon="crown"></span>VIP</a>
    </nav>
  </div>

  <div id="yt-float" class="yt-float" hidden>
    <div class="yt-float-head">
      <span id="yt-float-title" class="yt-float-title"></span>
      <button class="icon-btn" data-action="yt-close" aria-label="Cerrar video"><span data-icon="x" data-icon-size="16"></span></button>
    </div>
    <div id="yt-player" class="yt-player"></div>
  </div>

  <div id="ad-banner" class="ad-banner" hidden role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
